<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XCPC 每日一题</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #262b36;
      --text: #e8eaf0;
      --muted: #9aa3b2;
      --accent: #4da3ff;
      --tag-bg: #1e2a3a;
      --tag-text: #8ecbff;
      --gold: #f5c451;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
    header { text-align: center; margin-bottom: 28px; }
    header h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 1px; }
    header p { margin: 0; color: var(--muted); font-size: 14px; }
    .latest {
      background: linear-gradient(135deg, #1a2030, #171a21);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 24px;
    }
    .latest .label {
      color: var(--gold);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .latest .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .latest .meta { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .btn:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #1b1f28; font-size: 13px; color: var(--muted); font-weight: 600; }
    td { font-size: 14px; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .pro { font-weight: 600; }
    .pro a { color: var(--text); text-decoration: none; }
    .pro a:hover { color: var(--accent); }
    .badge {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 6px;
      padding: 1px 8px;
      font-size: 12px;
      margin: 1px 3px 1px 0;
      white-space: nowrap;
    }
    .diff { color: var(--gold); font-weight: 600; }
    .muted { color: var(--muted); }
    footer { margin-top: 28px; text-align: center; color: var(--muted); font-size: 12px; }
    footer a { color: var(--muted); }
    @media (max-width: 600px) {
      th:nth-child(1), td:nth-child(1) { display: none; } /* 手机上隐藏日期列，最新日期已在卡片显示 */
      th, td { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>XCPC 每日一题</h1>
      <p>ICPC / CCPC 真题 · 每天一道 · 只记录「来源 · 题目 · 链接」</p>
    </header>

    <section id="latest" class="latest" hidden>
      <div class="label">TODAY · 今日题目</div>
      <div class="title" id="latest-title"></div>
      <div class="meta" id="latest-meta"></div>
      <a class="btn" id="latest-link" href="#" target="_blank" rel="noopener">打开题目 ↗</a>
    </section>

    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>来源</th>
          <th>题目</th>
          <th>链接</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>

    <footer>
      数据文件：<code>data.json</code> · 每天在 GitHub 上编辑该文件加一行即可自动更新
    </footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function badges(item) {
      const parts = [];
      if (item.difficulty) {
        parts.push(`<span class="badge diff">${esc(item.difficulty)}</span>`);
      }
      (item.tags || []).forEach((t) => {
        parts.push(`<span class="badge">${esc(t)}</span>`);
      });
      return parts.join(" ");
    }

    function render(data) {
      const list = [...data].sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const tbody = $("list");
      tbody.innerHTML = list.map((item) => `
        <tr>
          <td class="muted">${esc(item.date)}</td>
          <td>${esc(item.source)}</td>
          <td class="pro"><a href="${esc(item.link)}" target="_blank" rel="noopener">${esc(item.title)}</a>${badges(item) ? " " + badges(item) : ""}</td>
          <td><a href="${esc(item.link)}" target="_blank" rel="noopener">${esc(item.link)}</a></td>
        </tr>`).join("");

      if (list.length > 0) {
        const today = list[0];
        $("latest").hidden = false;
        $("latest-title").textContent = today.title;
        $("latest-meta").innerHTML = `${esc(today.date)} · ${esc(today.source)}${badges(today) ? " · " + badges(today) : ""}`;
        $("latest-link").href = today.link;
      }
    }

    fetch("./data.json")
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then((data) => render(Array.isArray(data) ? data : (data.problems || [])))
      .catch((err) => {
        $("list").innerHTML =
          `<tr><td colspan="4" class="muted">加载 data.json 失败：${esc(err.message)}。
          请通过本地服务器或 GitHub Pages 访问本页面。</td></tr>`;
      });
  </script>
</body>
</html>
